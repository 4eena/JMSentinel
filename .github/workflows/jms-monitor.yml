
name: JMS Monitor

on:
  workflow_dispatch:
  schedule:
  - cron: '2-59/5 * * * *'
  - cron: '4-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: jms-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout monitor state
        uses: actions/checkout@v4
        with:
          ref: monitor-state
          path: state

      - name: Run monitor
        working-directory: app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_NOTIFICATIONS: "true"
        run: |
          cp ../state/state.json state.json 2>/dev/null || true
          python3 monitor.py
          cp state.json ../state/state.json

      - name: Save monitor state
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update JMS monitor state"
            git push origin HEAD:monitor-state
          fi
