      
name: JMS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check JMS servers
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              "https://maplestatus.info/api/games/"
              "maplestory/japan/worlds/servers"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "JMSentinel/1.0",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              worlds = json.load(r)

          if not isinstance(worlds, list) or not worlds:
              raise RuntimeError("Invalid API response")

          online = 0
          offline = 0

          for world in worlds:
              name = world["info"]["name"]
              servers = world["data"]
              for server in servers:
                  status = server["status"]

                  if type(status) is not int:
                      raise RuntimeError(f"Invalid status: {status}")

                  if status == 1:
                      online += 1
                  elif status == 0:
                      offline += 1
                  else:
                      raise RuntimeError(f"Unknown status: {status}")
              print(f"{name}: {len(servers)} servers")

          if online + offline == 0:
              raise RuntimeError("No servers found")

          print(f"Online: {online}, Offline: {offline}")
          PY
